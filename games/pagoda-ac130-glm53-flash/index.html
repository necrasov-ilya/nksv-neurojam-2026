    bar.className = 'wbar';
    const fill = document.createElement('div');
    fill.className = 'wbarfill';
    bar.appendChild(fill);
    chip.appendChild(row);
    chip.appendChild(bar);
    tl.appendChild(chip);
    AR_chips.push(chip);
    AR_wammos.push(ammo);
    AR_wbars.push(bar);
    AR_wbarfills.push(fill);
  });
  const therm = document.createElement('div');
  therm.id = 'therm';
  therm.className = 'therm';
  therm.textContent = 'SENSOR [N]  WHOT';
  tl.appendChild(therm);
  hud.appendChild(tl);

  const tr = document.createElement('div');
  tr.className = 'tr';
  const scoreLine = document.createElement('div');
  scoreLine.className = 'score';
  scoreLine.textContent = 'SCORE  ';
  const score = document.createElement('span');
  score.id = 'score';
  score.textContent = '0000';
  scoreLine.appendChild(score);
  tr.appendChild(scoreLine);
  const tlist = document.createElement('div');
  tr.appendChild(tlist);
  hud.appendChild(tr);

  const bl = document.createElement('div');
  bl.className = 'bl';
  const aim = document.createElement('div');
  aim.id = 'aim';
  aim.textContent = 'E ---.0  Z ---.0   RNG ---.0   AGL 0095';
  const zoomEl = document.createElement('div');
  zoomEl.id = 'zoom';
  zoomEl.textContent = 'ZOOM x1';
  const fps = document.createElement('div');
  fps.id = 'fps';
  fps.textContent = 'FPS 60';
  bl.appendChild(aim);
  bl.appendChild(zoomEl);
  bl.appendChild(fps);
  hud.appendChild(bl);

  const help = document.createElement('div');
  help.id = 'help';
  help.innerHTML = '<div class="hline"><kbd>MOUSE</kbd> sensor slew &middot; <kbd>WHEEL</kbd> zoom x1/x2/x4 &middot; <kbd>CLICK / RMB / SPACE</kbd> fire &middot; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> weapon &middot; <kbd>N</kbd> whot/dusk &middot; <kbd>R</kbd> reset &middot; <kbd>H</kbd> help</div>';
  hud.appendChild(help);

  document.body.appendChild(hud);

  // ---- HUD updaters ----
  const AR_pad4 = v => String(Math.max(0, Math.min(9999, Math.round(v)))).padStart(4, '0');
  const AR_pad1 = v => String(Math.max(0, Math.min(9999.9, v))).padStart(6, '0');

  function AR_updateAmmo() {
    for (let i = 0; i < AR_WEAPONS.length; i++) {
      AR_wammos[i].textContent = String(AR_ammo[i]);
      if (AR_reloading[i]) {
        AR_wbars[i].style.display = 'block';
        AR_wbarfills[i].style.width = (clamp(AR_reloadT[i] / AR_WEAPONS[i].reload, 0, 1) * 100).toFixed(1) + '%';
      } else {
        AR_wbars[i].style.display = 'none';
      }
    }
  }

  function AR_updateScore() {
    let sum = 0;
    for (const s of state.structures) if (s.destroyed) sum += s.points;
    state.score = sum;
    score.textContent = AR_pad4(sum);
  }

  function AR_fmtCoord(v) {
    const s = v < 0 ? '-' : '+';
    const a = Math.abs(v);
    let i = Math.floor(a);
    let d = Math.round((a - i) * 10);
    if (d === 10) { i += 1; d = 0; }
    return s + String(i).padStart(3, '0') + '.' + d;
  }

  function AR_updateAim() {
    if (AR_aimValid && AR_aimActive) {
      const rng = AR_aimPoint.distanceTo(AR_gs.pos);
      aim.textContent = 'E ' + AR_fmtCoord(AR_aimPoint.x) + '  Z ' + AR_fmtCoord(AR_aimPoint.z) +
        '   RNG ' + AR_pad1(rng) + '   AGL ' + AR_pad1(AR_gs.pos.y);
    } else {
      aim.textContent = 'E ---.0  Z ---.0   RNG ---.0   AGL ' + AR_pad1(AR_gs.pos.y);
    }
  }

  function AR_updateFps() { fps.textContent = 'FPS ' + AR_fps; }

  function AR_updateZoom() { zoomEl.textContent = 'ZOOM x' + AR_ZOOM_X[AR_zoom]; }

  function AR_updateTherm() { therm.textContent = 'SENSOR [N]  ' + (state.thermal ? 'WHOT' : 'DUSK'); }

  function refreshHud() {
    tlist.innerHTML = '';
    AR_rows.length = 0;
    for (const s of state.structures) {
      const row = document.createElement('div');
      row.className = s.destroyed ? 'trow struck' : 'trow';
      const nm = document.createElement('span');

      row.appendChild(pt);
      row.appendChild(st);
      tlist.appendChild(row);
      AR_rows.push(row);
    }
    AR_updateScore();
    AR_updateAmmo();
    AR_updateTherm();
    AR_updateAim();
    AR_updateZoom();
    AR_updateFps();
  }

  function markStructure(s) {
    const idx = state.structures.indexOf(s);
    if (idx < 0) return;
    const row = AR_rows[idx];
    if (!row) return;
    row.className = s.destroyed ? 'trow struck' : 'trow';
    row.children[2].textContent = s.destroyed ? 'STRUCK' : 'ALIVE';
    AR_updateScore();
  }

  // ---- weapons ----
  function AR_writeProj(i) {
    const p = AR_pData[i];
    AR_tV.copy(p.vel).normalize();
    AR_tQ.setFromUnitVectors(AR_Z_AXIS, AR_tV);
    AR_tS.set(p.w.rad, p.w.rad, p.w.len); // long axis on Z: quaternion maps +Z to velocity
    AR_tM.compose(p.pos, AR_tQ, AR_tS);
    AR_pMesh.setMatrixAt(i, AR_tM);
  }

  function AR_touchProj(i) {
    AR_pMesh.setColorAt(i, state.thermal ? AR_WHOT_T : AR_pData[i].w.tcolor);
    AR_pMesh.count = AR_pCount;
    AR_pMesh.instanceMatrix.needsUpdate = true;
    if (AR_pMesh.instanceColor) AR_pMesh.instanceColor.needsUpdate = true;
  }

  // ballistic launch solver: choose the initial velocity so the projectile, integrated
  // with the SAME semi-implicit Euler / fixed step as tick(), arrives at `target`.
  // The integrator is linear in v0 per axis, so this is EXACT:
  //   A = displacement per unit initial velocity (identical for all axes)
  //   B = y-displacement from gravity alone (dragged)
  //   v0 = (D - B) / A
  function AR_solveLaunch(from, to, w) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const T = clamp(dist / w.speed, 0.3, 12);
    const n = Math.max(1, Math.round(T / AR_H));
    const f = w.drag ? 1 - w.drag * AR_H : 1;
    let A = 0, pow = 1;
    for (let s = 0; s < n; s++) { pow *= f; A += pow * AR_H; }
    let B = 0, vyy = 0;
    for (let s = 0; s < n; s++) { vyy = (vyy - (w.g || 0) * AR_H) * f; B += vyy * AR_H; }
    return new THREE.Vector3(dx / A, (dy - B) / A, dz / A);
  }

  function AR_spawnProj(from, target) {
    if (AR_pCount >= 200) return;
    const w = AR_WEAPONS[AR_sel];
    const i = AR_pCount++;
    const vel = AR_solveLaunch(from, target, w);
    AR_pData[i] = { pos: from.clone(), vel: vel, w: w,
      target: w.name === 'NUKE' ? target.clone() : null, age: 0 };
    AR_writeProj(i);
    AR_touchProj(i);
  }

  function AR_killProj(i) {
    const last = AR_pCount - 1;
    if (i !== last) {
      AR_pData[i] = AR_pData[last];
      AR_writeProj(i);
      AR_touchProj(i);
    }
    AR_pCount = last;
    AR_pMesh.count = AR_pCount;
    if (AR_pMesh.instanceColor) AR_pMesh.instanceColor.needsUpdate = true;
  }

  // ---- procedural weapon audio (WebAudio; starts after first user gesture) ----
  let AR_audio = null;
  let AR_master = null;
  let AR_audioSeed = 0xAC130;

  function AR_randAudio() {
    AR_audioSeed = (Math.imul(1664525, AR_audioSeed) + 1013904223) >>> 0;
    return AR_audioSeed / 4294967296;
  }

  function AR_audioInit() {
    if (!AR_audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      AR_audio = new AC();
      const comp = AR_audio.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 8;
      comp.attack.value = 0.002; comp.release.value = 0.22;
      AR_master = AR_audio.createGain();
      AR_master.gain.value = 0.72;
      AR_master.connect(comp).connect(AR_audio.destination);
    }
    if (AR_audio.state === 'suspended') AR_audio.resume();
    return AR_audio;
  }

  function AR_tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    const ac = AR_audioInit(); if (!ac) return;
    const now = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), now);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(AR_master); o.start(now); o.stop(now + dur + 0.02);
  }

  function AR_noise(dur, vol, cutoff, delay = 0, highpass = 0) {
    const ac = AR_audioInit(); if (!ac) return;
    const now = ac.currentTime + delay;
    const n = Math.max(64, Math.ceil(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (AR_randAudio() * 2 - 1) * (1 - i / n * 0.35);
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter();
    const hp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = cutoff;
    hp.type = 'highpass'; hp.frequency.value = highpass;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(lp).connect(hp).connect(g).connect(AR_master);
    src.start(now); src.stop(now + dur + 0.02);
  }

  function AR_audioShot(w) {
    const n = w.name;
    if (n.indexOf('25MM') >= 0) {
      AR_noise(0.055, 0.18, 7500, 0, 900); AR_tone(135, 62, 0.095, 0.24, 'square');
      AR_tone(920, 410, 0.035, 0.045, 'sawtooth', 0.012);
    } else if (n.indexOf('40MM') >= 0) {
      AR_noise(0.22, 0.34, 2600, 0, 70); AR_tone(92, 34, 0.34, 0.52, 'sine');
      AR_tone(210, 72, 0.12, 0.18, 'triangle', 0.015);
    } else if (n.indexOf('70MM') >= 0) {
      AR_noise(0.55, 0.25, 4200, 0, 180); AR_tone(78, 42, 0.65, 0.35, 'sawtooth');
      AR_tone(420, 125, 0.32, 0.08, 'triangle', 0.04);
    } else if (n.indexOf('NUKE') >= 0) {
      AR_noise(0.9, 0.30, 1800, 0, 40); AR_tone(54, 24, 1.1, 0.62, 'sawtooth');
      AR_tone(180, 48, 0.55, 0.18, 'triangle', 0.06);
    }
  }

  function AR_audioImpact(w) {
    const n = w.name;
    if (n.indexOf('25MM') >= 0) {
      AR_noise(0.035, 0.07, 9000, 0, 1800); AR_tone(260, 120, 0.045, 0.05, 'square');
    } else if (n.indexOf('40MM') >= 0) {
      AR_noise(0.38, 0.30, 1900, 0, 35); AR_tone(76, 27, 0.48, 0.48, 'sine');
      AR_noise(0.15, 0.12, 6000, 0.02, 800);
    } else if (n.indexOf('70MM') >= 0) {
      AR_noise(0.85, 0.45, 2200, 0, 25); AR_tone(68, 19, 1.05, 0.65, 'sine');
      AR_tone(135, 34, 0.42, 0.22, 'sawtooth', 0.025);
    } else if (n.indexOf('NUKE') >= 0) {
      AR_noise(2.8, 0.72, 1700, 0, 12); AR_noise(0.09, 0.52, 11000, 0, 700);
      AR_tone(48, 14, 3.2, 0.90, 'sine'); AR_tone(82, 19, 1.5, 0.52, 'sawtooth', 0.08);
      AR_tone(61, 16, 1.8, 0.42, 'sine', 0.28); AR_noise(1.35, 0.32, 850, 0.42, 8);
      AR_tone(39, 12, 2.4, 0.55, 'triangle', 0.58);
    }
  }

  function AR_explode(p, w) {
    AR_audioImpact(w);
    if (state.destruction) state.destruction.hit(p, w.blast, w.dmg, w.power, w.name);
  }

  function fireAt(point) {
    if (!point || typeof point.x !== 'number') return;
    if (AR_reloading[AR_sel] || AR_ammo[AR_sel] <= 0) return;
    AR_ammo[AR_sel]--;
    AR_audioShot(AR_WEAPONS[AR_sel]);
    AR_muz.set(-4.5, -2.2, 1.8).applyQuaternion(AR_gs.group.quaternion).add(AR_gs.pos);
    AR_spawnProj(AR_muz, point);
    if (AR_ammo[AR_sel] <= 0) {
      AR_reloading[AR_sel] = true;
      AR_reloadT[AR_sel] = 0;
    }
    AR_updateAmmo();
  }

  function AR_tryHold() {
    if (!AR_aimValid) return;
    if (AR_reloading[AR_sel] || AR_ammo[AR_sel] <= 0 || AR_cd[AR_sel] > 0) return;
    AR_cd[AR_sel] = 1 / AR_WEAPONS[AR_sel].fireRate;
    fireAt(AR_aimPoint);
  }

  function selectWeapon(i) {
    i = clamp(Math.round(i), 0, AR_WEAPONS.length - 1);
    if (i === AR_sel) return;
    AR_sel = i;
    for (let j = 0; j < AR_WEAPONS.length; j++) AR_chips[j].classList.toggle('sel', j === i);
    AR_updateAmmo();
  }

  // sensor zoom: discrete steps, like the real FLIR (FOV 30/18/10)
  function zoom(delta) {
    AR_zoom = clamp(AR_zoom + delta, 0, 2);
    state.camera.fov = AR_FOVS[AR_zoom];
    state.camera.updateProjectionMatrix();
    AR_updateZoom();
  }

  // sensor slew: point the reticle at NDC (nx, ny) and latch it
  function slew(nx, ny) {
    AR_ndc.x = clamp(nx, -1.2, 1.2);
    AR_ndc.y = clamp(ny, -1.2, 1.2);
    AR_aimActive = true;
  }

  function setThermal(on) {
    state.thermal = on;
    if (state.applyThermal) state.applyThermal(on);
    document.body.classList.toggle('thermal', on);
    document.body.classList.toggle('natural', !on);
    AR_ringMat.color.setHex(on ? 0xdfe6ff : 0xff3344);
    AR_laserMat.color.setHex(on ? 0x9aa0b0 : 0xff2233);
    AR_updateTherm();
  }

  function AR_toggleHelp() {
    AR_helpOn = !AR_helpOn;
    help.classList.toggle('on', AR_helpOn);
  }

  function reset() {
    for (let i = 0; i < AR_WEAPONS.length; i++) {
      AR_ammo[i] = AR_WEAPONS[i].maxAmmo;
      AR_reloading[i] = false;
      AR_reloadT[i] = 0;
      AR_cd[i] = 0;
    }
    AR_sel = 0;
    for (let j = 0; j < AR_WEAPONS.length; j++) AR_chips[j].classList.toggle('sel', j === 0);
    AR_pCount = 0;
    AR_pAcc = 0;
    AR_pMesh.count = 0;
    AR_rmb = false;
    AR_space = false;
    refreshHud();
  }

  // ---- input ----
  let AR_lmb = null;
  let AR_lmbHeld = false;

  const AR_onDown = e => {
    if (e.button === 0) {
      AR_lmb = { x0: e.clientX, y0: e.clientY, dragged: false };
      AR_lmbHeld = true;
      AR_tryHold();
    } else if (e.button === 2) {
      AR_rmb = true;
      AR_tryHold();
    }
  };

  const AR_onMove = e => {
    AR_ptrInside = true;
    AR_ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
    AR_ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    AR_aimActive = true;
    if (AR_lmb && !AR_lmb.dragged && Math.hypot(e.clientX - AR_lmb.x0, e.clientY - AR_lmb.y0) > 5) {
      AR_lmb.dragged = true; // a swipe is not a shot
    }
  };

  const AR_onUp = e => {
    if (e.button === 2) AR_rmb = false;
    if (e.button === 0) { AR_lmbHeld = false; AR_lmb = null; }
  };

  window.addEventListener('pointerdown', AR_onDown);
  window.addEventListener('pointermove', AR_onMove);
  window.addEventListener('pointerup', AR_onUp);
  window.addEventListener('pointercancel', AR_onUp);
  window.addEventListener('blur', () => {
    AR_rmb = false;
    AR_space = false;
    AR_lmbHeld = false;
    AR_lmb = null;
    AR_ptrInside = false;
  });
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('wheel', e => {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });
  document.addEventListener('pointerover', () => { AR_ptrInside = true; });
  document.addEventListener('pointerout', e => { if (!e.relatedTarget) AR_ptrInside = false; });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      AR_space = true;
      AR_tryHold();
    } else if (e.code === 'Digit1') selectWeapon(0);
    else if (e.code === 'Digit2') selectWeapon(1);
    else if (e.code === 'Digit3') selectWeapon(2);
    else if (e.code === 'Digit4') selectWeapon(3);
    else if (e.key === 'n' || e.key === 'N') setThermal(!state.thermal);
    else if (e.key === 'r' || e.key === 'R') { if (state.onResetRequest) state.onResetRequest(); }
    else if (e.key === 'h' || e.key === 'H') AR_toggleHelp();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') AR_space = false;
  });

  // ---- per-frame ----
  function tick(dt) {
    dt = clamp(dt, 0, 0.1);
    AR_time += dt;

    // gunship slow circle (r 120, h 95, 60 s), face travel, bank 0.1
    const ga = AR_time * TAU / 60;
    AR_gs.pos.set(Math.cos(ga) * 120, 95, Math.sin(ga) * 120);
    AR_gs.group.position.copy(AR_gs.pos);
    AR_tV.set(-Math.sin(ga), 0, Math.cos(ga)).add(AR_gs.pos);
    AR_gs.group.lookAt(AR_tV);
    AR_gs.group.rotateZ(0.1);
    AR_navMat.opacity = Math.sin(AR_time * TAU * 2) > 0 ? 1 : 0.06;

    // camera: sensor pod under the gunship; look-at drifts toward the slewed aim point.
    // At x1 mostly fixed on the compound; deeper zoom pans the sensor (real FLIR behavior).
    state.camera.position.set(AR_gs.pos.x, AR_gs.pos.y - 2.5, AR_gs.pos.z);
    if (AR_aimValid) AR_camTgt.lerp(AR_aimPoint, 1 - Math.exp(-dt * 2.5));
    const AR_lk = AR_tV2.set(0, 0, 0).lerp(AR_camTgt, AR_PAN[AR_zoom]);
    state.camera.lookAt(AR_lk);
    state.camera.updateMatrixWorld();

    // aim: sensor ray through the reticle NDC, clamped to the 35-degree slew cone
    // around the boresight (gunship -> compound center)
    AR_aimValid = false;
    if (AR_aimActive) {
      AR_gazeDir.set(-AR_gs.pos.x, -AR_gs.pos.y, -AR_gs.pos.z).normalize();
      AR_ray.setFromCamera(AR_ndc, state.camera);
      if (AR_ray.ray.intersectPlane(AR_plane, AR_aimRaw)) {
        const v = AR_tV2.subVectors(AR_aimRaw, AR_gs.pos);
        if (v.length() > 0.5) {
          v.normalize();
          const ca = v.dot(AR_gazeDir);
          if (ca < AR_COS35) {
            // rotate the over-slew vector onto the cone rim
            AR_tV3.copy(v).addScaledVector(AR_gazeDir, -ca);
            if (AR_tV3.lengthSq() > 1e-8) {
              AR_tV3.normalize();
              v.copy(AR_gazeDir).multiplyScalar(AR_COS35).addScaledVector(AR_tV3, AR_SIN35);
            } else {
              v.copy(AR_gazeDir);
            }
          }
          if (v.y < -1e-4) {
            AR_aimPoint.copy(AR_gs.pos).addScaledVector(v, -AR_gs.pos.y / v.y);
          } else {
            AR_aimPoint.copy(AR_gs.pos).addScaledVector(AR_gazeDir, -AR_gs.pos.y / AR_gazeDir.y);
          }
          AR_aimPoint.y = 0;
          AR_aimValid = true;
        }
      }
    }

    // reticle with subtle sensor micro-jitter (visual only; firing uses the exact point)
    AR_jT += dt;
    const jx = 0.1 * Math.sin(AR_jT * 6.1) + 0.07 * Math.sin(AR_jT * 13.7 + 1.3);
    const jz = 0.1 * Math.sin(AR_jT * 5.3 + 0.7) + 0.07 * Math.sin(AR_jT * 11.9 + 2.1);
    AR_ring.visible = AR_aimValid;
    AR_ticks.visible = AR_aimValid;
    if (AR_aimValid) {
      AR_ring.position.set(AR_aimPoint.x + jx, 0.05, AR_aimPoint.z + jz);
      AR_ticks.position.set(AR_ring.position.x, 0.05, AR_ring.position.z);
      const lp = AR_laserGeom.attributes.position;
      lp.setXYZ(0, AR_gs.pos.x, AR_gs.pos.y, AR_gs.pos.z);
      lp.setXYZ(1, AR_aimPoint.x, 0.05, AR_aimPoint.z);
      lp.needsUpdate = true;
      AR_laser.computeLineDistances();
    }

    // hold-to-fire (RMB / Space), rate-limited
    if (AR_rmb || AR_space || AR_lmbHeld) AR_tryHold();
    for (let i = 0; i < AR_WEAPONS.length; i++) if (AR_cd[i] > 0) AR_cd[i] = Math.max(0, AR_cd[i] - dt);

    // reload timers
    for (let i = 0; i < AR_WEAPONS.length; i++) {
      if (!AR_reloading[i]) continue;
      AR_reloadT[i] += dt;
      if (AR_reloadT[i] >= AR_WEAPONS[i].reload) {
        AR_reloading[i] = false;
        AR_ammo[i] = AR_WEAPONS[i].maxAmmo;
        AR_updateAmmo();
      }
    }

    // projectiles (fixed-step integration: deterministic match to the launch solver)
    AR_pAcc += dt;
    let pGuard = 0;
    while (AR_pAcc >= AR_H && pGuard++ < 10) {
      AR_pAcc -= AR_H;
      for (let i = 0; i < AR_pCount; i++) {
        const p = AR_pData[i];
        const w = p.w;
        // NUKE: guided 3-second cinematic flight, guaranteed detonation at designated point.
        if (p.target) {
          p.age += AR_H;
          AR_tV.subVectors(p.target, p.pos);
          const left = AR_tV.length();
          if (left > 0.01) {
            AR_tV.multiplyScalar(Math.min(1, 55 * AR_H / left));
            p.pos.add(AR_tV);
            p.vel.copy(AR_tV).multiplyScalar(1 / AR_H);
          }
          if (left <= 2 || p.age >= 3) {
            p.pos.copy(p.target);
            AR_explode(p.pos, w);
            AR_killProj(i);
            i--;
          } else {
            AR_writeProj(i);
          }
          continue;
        }
        if (w.g) p.vel.y -= w.g * AR_H;
        if (w.drag) {
          const f = 1 - w.drag * AR_H;
          p.vel.x *= f;
          p.vel.y *= f;
          p.vel.z *= f;
        }
        p.pos.x += p.vel.x * AR_H;
        p.pos.y += p.vel.y * AR_H;
        p.pos.z += p.vel.z * AR_H;
        let boom = p.pos.y <= 0;
        if (!boom) {
          const rr = (w.blast + 0.3) * (w.blast + 0.3);
          const blocks = state.blocks;
          for (let j = 0; j < blocks.length; j++) {
            const b = blocks[j];
            if (!b.alive) continue;
            const bdx = b.pos.x - p.pos.x;
            const bdy = b.pos.y - p.pos.y;
            const bdz = b.pos.z - p.pos.z;
            if (bdx * bdx + bdy * bdy + bdz * bdz < rr) { boom = true; break; }
          }
        }
        if (boom) {
          AR_explode(p.pos, w);
          AR_killProj(i);
          i--;
        } else {
          AR_writeProj(i);
        }
      }
      if (AR_pCount > 0) AR_pMesh.instanceMatrix.needsUpdate = true;
    }

    // fps + 10 Hz text updates
    AR_fpsFrames++;
    AR_fpsAcc += dt;
    if (AR_fpsAcc >= 0.1) {
      AR_fps = Math.round(AR_fpsFrames / AR_fpsAcc);
      AR_fpsFrames = 0;
      AR_fpsAcc = 0;
    }
    AR_hudAcc += dt;
    if (AR_hudAcc >= 0.1) {
      AR_hudAcc = 0;
      AR_updateAmmo();
      AR_updateAim();
      AR_updateFps();
    }
  }

  AR_chips[0].classList.add('sel');
  refreshHud();
  console.log('[ARSENAL] C-130 online: sensor-locked camera, 3 weapons, WHOT default');

  return {
    selectWeapon,
    fireAt,
    tick,
    reset,
    refreshHud,
    markStructure,
    setThermal,
    zoom,
    slew,
    aimPoint: AR_aimPoint,
  };
}

// ===== SECTION D: MAIN =====
const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(0, 95, 0);

const dir = new THREE.DirectionalLight(0xfff2dd, 3.0); // soft warm daylight, high
dir.position.set(60, 90, -40);
dir.target.position.set(4, 0, 6);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -60;
dir.shadow.camera.right = 60;
dir.shadow.camera.top = 60;
dir.shadow.camera.bottom = -60;
dir.shadow.camera.near = 5;
dir.shadow.camera.far = 260;
dir.shadow.bias = -0.0004;
scene.add(dir, dir.target);
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x7a9a5a, 2.2);
const fill = new THREE.DirectionalLight(0xcfe4ff, 1.1); // bright sky fill from the opposite side
fill.position.set(-60, 40, 50);
scene.add(fill);
scene.add(hemi);

const state = {
  scene: scene,
  camera: camera,
  blocks: [],
  structures: [],
  mats: {},
  water: null,
  lights: { dir: dir, hemi: hemi },
  thermal: true,
  score: 0,
  downgraded: false,
  gunship: null,
  destruction: null,
  arsenal: null,
  applyThermal: null,
  onBlockDestroyed: null,
  onStructureDestroyed: null,
  onResetRequest: null,
};

let renderer;
try {
  renderer = new THREE.WebGLRenderer({antialias:true});
} catch (err) {
  console.warn('[MAIN] WebGL unavailable:', err);
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
scene.fog = new THREE.Fog(0xdfeeff, 180, 700); // airy depth haze
renderer.toneMappingExposure = 1.45;
app.appendChild(renderer.domElement);

buildGarden();
state.applyThermal = applyThermal;
state.destruction = new Destruction();
state.arsenal = initArsenal();
state.arsenal.setThermal(true); // WHOT is the default view (body class + scene swap)
state.onBlockDestroyed = () => {};
state.onStructureDestroyed = (s) => { if (state.arsenal) state.arsenal.markStructure(s); };
state.onResetRequest = () => resetAll();

function resetAll() {
  resetGarden();
  if (state.destruction) state.destruction.reset();
  if (state.arsenal) state.arsenal.reset();
  state.score = 0;
  if (state.thermal) applyThermal(true);
}

let lastT = -1;
let fpsE = 60;
let lowT = 0;
function frame(tms) {
  const dt = lastT < 0 ? 0.016 : clamp((tms - lastT) / 1000, 0, 0.05);
  lastT = tms;
  if (dt > 0) fpsE += (1 / dt - fpsE) * 0.05;
  gardenTick(dt);
  if (state.arsenal) state.arsenal.tick(dt);
  if (state.destruction) state.destruction.update(dt);
  if (!state.downgraded) {
    if (fpsE < 42) {
      lowT += dt;
      if (lowT > 3) downgrade();
    } else {
      lowT = 0;
    }
  }
  renderer.render(scene, camera);
}

function downgrade() {
  state.downgraded = true;
  renderer.setPixelRatio(1);
  if (state.water) {
    state.water.meshA.material = state.water.cheap;
    state.water.meshB.material = state.water.cheap;
  }
  dir.shadow.mapSize.set(1024, 1024);
  if (dir.shadow.map) { dir.shadow.map.dispose(); dir.shadow.map = null; }
  console.log('[MAIN] performance downgrade: DPR 1, cheap water, shadow map 1024');
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
// headless-verification hook: exposes internals to the node harness/probe
state.THREE = THREE;
window.__ac130 = { state: state, THREE: THREE, renderer: renderer };
renderer.setAnimationLoop(frame);

</script>
