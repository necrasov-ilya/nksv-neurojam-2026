name: Check Godot project

on:
  push:
  pull_request:

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import resources
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run smoke check
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/smoke.gd
